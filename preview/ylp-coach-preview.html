<style>

/* ── Tokens ────────────────────────────────────────────────
   Dark is the default. Light is first-class, not a skin.
   Amber is the only accent: it marks the one thing that matters on a screen. */
:root {
  --font-fraunces: 'Fraunces', Georgia, serif;
  --font-inter: 'Inter', system-ui, sans-serif;
  --canvas: #101014;
  --surface: #1a1a1a;
  --raised: #222226;
  --ink: #f3f1ea;
  --muted: #a4a4ad;
  --faint: #6f6f78;
  --hair: rgba(255, 255, 255, 0.08);
  --hair-strong: rgba(255, 255, 255, 0.16);
  --amber: #fbb914;
  --amber-ink: #fbb914; /* amber used as text */
  --on-amber: #14110a;
  --navy: #1e2761;
  --on-navy: #f3f1ea;
  --on-navy-muted: #b4b9d6;
  --danger: #ff8a7a;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --canvas: #f6f4ee;
  --surface: #ffffff;
  --raised: #efece4;
  --ink: #14141a;
  --muted: #565661;
  --faint: #8b8b95;
  --hair: rgba(20, 20, 26, 0.1);
  --hair-strong: rgba(20, 20, 26, 0.2);
  --amber-ink: #85590a;
  --danger: #b3261e;
  color-scheme: light;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --canvas: #f6f4ee;
    --surface: #ffffff;
    --raised: #efece4;
    --ink: #14141a;
    --muted: #565661;
    --faint: #8b8b95;
    --hair: rgba(20, 20, 26, 0.1);
    --hair-strong: rgba(20, 20, 26, 0.2);
    --amber-ink: #85590a;
    --danger: #b3261e;
    color-scheme: light;
  }
}


html { background: var(--canvas); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--canvas);
  color: var(--ink);
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
::selection { background: var(--amber); color: var(--on-amber); }

/* ── Type ─────────────────────────────────────────────── */
.display {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 500;
  letter-spacing: 0;
  word-spacing: 0.08em;
  line-height: 1.1;
  font-variation-settings: "opsz" 40;
}
.h1 { font-size: clamp(2.1rem, 7.2vw, 3.6rem); }
.h2 { font-size: clamp(1.5rem, 4.6vw, 2.1rem); line-height: 1.15; }
.eyebrow {
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--faint);
}
.eyebrow.amber { color: var(--amber-ink); }
.read {                       /* story + concept body: read tired, on a phone */
  font-size: 1.125rem;        /* 18px */
  line-height: 1.65;
  max-width: 66ch;
}
.read p { margin: 0 0 1em; }
.quote {
  font-family: 'Fraunces', Georgia, serif;
  font-size: 1.3rem;
  line-height: 1.5;
  font-weight: 400;
  font-style: italic;
  max-width: 60ch;
}

/* ── Surfaces & press ─────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--hair);
  border-radius: 18px;
  transition: transform 160ms ease, border-color 160ms ease;
}
a.card:hover, button.card:hover { border-color: var(--hair-strong); }
a.card:active, button.card:active, .press:active { transform: translateY(-2px); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
  min-height: 48px; padding: 0 1.4rem; border-radius: 999px;
  font-weight: 600; font-size: 0.95rem; cursor: pointer; border: 1px solid transparent;
  transition: transform 160ms ease, opacity 160ms ease, background 160ms ease;
  text-decoration: none;
}
.btn:active:not(:disabled) { transform: translateY(-2px); }
.btn-primary { background: var(--amber); color: var(--on-amber); }
.btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }
.btn-ghost { background: transparent; color: var(--ink); border-color: var(--hair-strong); }
.btn-ghost:hover { background: var(--hair); }
.chip {
  display: inline-flex; align-items: center; min-height: 44px; padding: 0 1rem;
  border-radius: 999px; border: 1px solid var(--hair-strong);
  font-size: 0.9rem; color: var(--ink); text-decoration: none; background: transparent;
  transition: transform 160ms ease, background 160ms ease;
}
.chip:hover { background: var(--hair); }
.chip:active { transform: translateY(-2px); }

.field {
  width: 100%; background: var(--surface); color: var(--ink);
  border: 1px solid var(--hair-strong); border-radius: 14px;
  padding: 0.85rem 1rem; font: inherit; font-size: 1rem; line-height: 1.5;
  transition: border-color 160ms ease;
}
.field::placeholder { color: var(--faint); }
.field:focus { outline: none; border-color: var(--amber); }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
.field:focus-visible { outline: none; }

/* ── Motif: the battery arc ───────────────────────────── */
.arc-fill { transition: stroke-dashoffset 1400ms cubic-bezier(0.22, 0.61, 0.36, 1); }
@keyframes arc-breathe { 0%,100% { opacity: 0.35 } 50% { opacity: 1 } }
.arc-loading { animation: arc-breathe 1.6s ease-in-out infinite; }

/* Page cross-fade, never slide */
@keyframes fade-in { from { opacity: 0 } to { opacity: 1 } }
main { animation: fade-in 220ms ease both; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

<script>
/** MAIN = Moment, Action, Impact, Now — YLP Workbook p.14. */
const W = 1080;
const H = 1350;
const LIMIT = 180;
const KIND_LABEL = {
    maestro: { name: "Maestro", who: "to someone in my team" },
    konnect: { name: "Konnect", who: "to a peer" },
};
const PLACEHOLDER = {
    kind: "maestro",
    to: "Ravi",
    from: "Your manager",
    moment: "Last Tuesday, when you noticed the error before it left your desk.",
    action: "You stayed back and fixed it yourself instead of waiting for someone else to catch it.",
    impact: "We avoided a problem that could have affected the whole team’s reputation.",
    now: "I’m recognising this today while it’s still fresh, rather than waiting for the next review conversation.",
    thanks: "Thank you for taking ownership and protecting the team’s standards.",
};
const DESIGNS = {
    navy: { label: "Navy", bg: "#1E2761", ink: "#F3F1EA", muted: "#B4B9D6", accent: "#FBB914", hair: "rgba(255,255,255,0.20)", track: "rgba(255,255,255,0.18)" },
    ink: { label: "Ink", bg: "#101014", ink: "#F3F1EA", muted: "#A4A4AD", accent: "#FBB914", hair: "rgba(255,255,255,0.14)", track: "rgba(255,255,255,0.14)" },
    paper: { label: "Paper", bg: "#F6F4EE", ink: "#14141A", muted: "#565661", accent: "#C58500", hair: "rgba(20,20,26,0.18)", track: "rgba(20,20,26,0.14)" },
};
const GENERIC = /\b(great job|good job|great work|good work|nice work|well done|keep it up|keep up the good work|excellent work|awesome|amazing job|superb|fantastic)\b/i;
const TRAIT = /\byou(?:'|’)?(?:re| are)\s+(?:so |very |really )?(?:hard-?working|smart|talented|dedicated|reliable|a (?:star|rockstar|great|good))\b/i;
const WHEN = /\b(monday|tuesday|wednesday|thursday|friday|saturday|sunday|yesterday|today|last (?:week|month|\w+day)|this (?:week|month)|when|during|after|before)\b|\d/i;
function check(field, text) {
    const t = text.trim();
    if (!t)
        return null;
    if (GENERIC.test(t) && t.length < 70)
        return { level: "block", msg: "That’s praise, not recognition. Say what they did. Not “Great job”, but “You stayed back and fixed it yourself instead of waiting for someone else to catch it.”" };
    if (field === "action" && TRAIT.test(t))
        return { level: "nudge", msg: "That describes who they are. Recognise a behaviour, not a personality trait: what did they do?" };
    if (field === "moment" && !WHEN.test(t))
        return { level: "nudge", msg: "Name the moment: when, and where? “Last Tuesday, when you noticed the error before it left your desk.”" };
    if (field === "action" && t.length < 30)
        return { level: "nudge", msg: "What did they actually do? One behaviour, in your own words." };
    if (field === "impact" && t.length < 30)
        return { level: "nudge", msg: "What did it make possible? The effect on the work, the team, a customer, or you." };
    return null;
}
function readyToExport(d) {
    const filled = d.to.trim() && d.moment.trim() && d.action.trim() && d.impact.trim();
    const blocked = ["moment", "action", "impact"].some((f) => check(f, d[f])?.level === "block");
    return Boolean(filled) && !blocked;
}
function teamsText(d) {
    const lines = [
        `${KIND_LABEL[d.kind].name} recognition for ${d.to.trim()}`,
        "",
        `Moment: ${d.moment.trim()}`,
        `Action: ${d.action.trim()}`,
        `Impact: ${d.impact.trim()}`,
    ];
    if (d.now.trim())
        lines.push(`Now: ${d.now.trim()}`);
    if (d.thanks.trim())
        lines.push("", d.thanks.trim());
    if (d.from.trim())
        lines.push("", `— ${d.from.trim()}`);
    return lines.join("\n");
}
function wrap(ctx, text, maxW) {
    const words = text.replace(/\s+/g, " ").trim().split(" ");
    const lines = [];
    let line = "";
    for (const w of words) {
        const test = line ? `${line} ${w}` : w;
        if (ctx.measureText(test).width > maxW && line) {
            lines.push(line);
            line = w;
        }
        else
            line = test;
    }
    if (line)
        lines.push(line);
    return lines;
}
function fit(ctx, text, font, maxW, tries) {
    for (const t of tries) {
        ctx.font = font(t.px);
        const lines = wrap(ctx, text, maxW);
        if (lines.length <= t.max)
            return { ...t, lines };
    }
    const t = tries[tries.length - 1];
    ctx.font = font(t.px);
    const lines = wrap(ctx, text, maxW).slice(0, t.max);
    lines[lines.length - 1] = lines[lines.length - 1].replace(/\s*\S*$/, "…");
    return { ...t, lines };
}
function drawCard(ctx, raw, design, fonts, preview) {
    const c = DESIGNS[design];
    const pad = 88;
    const innerW = W - pad * 2;
    const pick = (v, ph) => (v.trim() ? { t: v.trim(), dim: false } : { t: ph, dim: true });
    const d = {
        to: pick(raw.to, PLACEHOLDER.to),
        from: pick(raw.from, PLACEHOLDER.from),
        moment: pick(raw.moment, PLACEHOLDER.moment),
        action: pick(raw.action, PLACEHOLDER.action),
        impact: pick(raw.impact, PLACEHOLDER.impact),
        now: raw.now.trim() ? { t: raw.now.trim(), dim: false } : preview ? { t: PLACEHOLDER.now, dim: true } : null,
        thanks: raw.thanks.trim() ? { t: raw.thanks.trim(), dim: false } : preview ? { t: PLACEHOLDER.thanks, dim: true } : null,
    };
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = c.bg;
    ctx.fillRect(0, 0, W, H);
    ctx.textBaseline = "alphabetic";
    const alpha = (dim) => (dim ? 0.38 : 1);
    /* the motif, large and quiet in the corner */
    ctx.save();
    ctx.lineCap = "round";
    ctx.lineWidth = 22;
    ctx.globalAlpha = 0.7;
    const cx = W + 150, cy = H + 40, R = 560;
    const a0 = (150 * Math.PI) / 180, a1 = (390 * Math.PI) / 180;
    ctx.strokeStyle = c.track;
    ctx.beginPath();
    ctx.arc(cx, cy, R, a0, a1);
    ctx.stroke();
    ctx.restore();
    /* header: mark + kind */
    ctx.save();
    ctx.lineCap = "round";
    ctx.lineWidth = 7;
    ctx.strokeStyle = c.track;
    ctx.beginPath();
    ctx.arc(pad + 28, 112, 26, (150 * Math.PI) / 180, (390 * Math.PI) / 180);
    ctx.stroke();
    ctx.strokeStyle = c.accent;
    ctx.beginPath();
    ctx.arc(pad + 28, 112, 26, (150 * Math.PI) / 180, (215 * Math.PI) / 180);
    ctx.stroke();
    ctx.restore();
    ctx.fillStyle = c.muted;
    ctx.font = `600 24px ${fonts.ui}`;
    ctx.letterSpacing = "5px";
    ctx.fillText(`${KIND_LABEL[raw.kind].name.toUpperCase()}  ·  RECOGNITION`, pad + 84, 121);
    ctx.letterSpacing = "0px";
    /* name */
    ctx.fillStyle = c.muted;
    ctx.font = `500 28px ${fonts.ui}`;
    ctx.fillText("For", pad, 232);
    let px = 104;
    const nameFont = (p) => `500 ${p}px ${fonts.display}`;
    ctx.font = nameFont(px);
    while (ctx.measureText(d.to.t).width > innerW && px > 52) {
        px -= 4;
        ctx.font = nameFont(px);
    }
    ctx.globalAlpha = alpha(d.to.dim);
    ctx.fillStyle = c.ink;
    ctx.fillText(d.to.t, pad, 232 + px * 0.98);
    ctx.globalAlpha = 1;
    /* four blocks */
    const blocks = [
        ["M", "MOMENT", d.moment], ["A", "ACTION", d.action], ["I", "IMPACT", d.impact], ["N", "NOW", d.now],
    ];
    const bodyX = pad + 112;
    const bodyW = W - pad - bodyX;
    let y = 440;
    const gap = 36;
    ctx.strokeStyle = c.hair;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(pad, y - 40);
    ctx.lineTo(W - pad, y - 40);
    ctx.stroke();
    for (const [letter, label, val] of blocks) {
        if (!val) {
            continue;
        }
        ctx.globalAlpha = alpha(val.dim);
        ctx.fillStyle = c.accent;
        ctx.font = `500 96px ${fonts.display}`;
        ctx.fillText(letter, pad, y + 80);
        ctx.fillStyle = c.muted;
        ctx.font = `600 20px ${fonts.ui}`;
        ctx.letterSpacing = "4px";
        ctx.fillText(label, bodyX, y + 22);
        ctx.letterSpacing = "0px";
        const f = fit(ctx, val.t, (p) => `400 ${p}px ${fonts.ui}`, bodyW, [
            { px: 33, lh: 45, max: 3 }, { px: 29, lh: 40, max: 4 }, { px: 26, lh: 36, max: 4 },
        ]);
        ctx.fillStyle = c.ink;
        ctx.font = `400 ${f.px}px ${fonts.ui}`;
        f.lines.forEach((ln, i) => ctx.fillText(ln, bodyX, y + 22 + 16 + f.px + i * f.lh));
        const h = Math.max(110, 22 + 16 + f.px + (f.lines.length - 1) * f.lh + 8);
        ctx.globalAlpha = 1;
        y += h + gap;
    }
    /* closing line */
    if (d.thanks) {
        const f = fit(ctx, d.thanks.t, (p) => `italic 400 ${p}px ${fonts.display}`, innerW, [
            { px: 38, lh: 52, max: 2 }, { px: 32, lh: 44, max: 2 },
        ]);
        ctx.globalAlpha = alpha(d.thanks.dim);
        ctx.fillStyle = c.ink;
        ctx.font = `italic 400 ${f.px}px ${fonts.display}`;
        const top = Math.min(y + 6, H - 150 - f.lines.length * f.lh);
        f.lines.forEach((ln, i) => ctx.fillText(ln, pad, top + f.px + i * f.lh));
        ctx.globalAlpha = 1;
    }
    /* footer */
    ctx.fillStyle = c.muted;
    ctx.font = `500 26px ${fonts.ui}`;
    ctx.globalAlpha = alpha(d.from.dim);
    ctx.fillText(`— ${d.from.t}`, pad, H - 76);
    ctx.globalAlpha = 1;
    ctx.font = `600 18px ${fonts.ui}`;
    ctx.textAlign = "right";
    ctx.letterSpacing = "4px";
    ctx.fillText("ATOMBERG  ·  YLP", W - pad, H - 78);
    ctx.letterSpacing = "0px";
    ctx.textAlign = "left";
}

const bySlug = (slug) => SCENARIOS.find((s) => s.slug === slug);

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const app = $("#app");

/* ── theme ── */
try { const t = localStorage.getItem("ylp-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
$("#theme").onclick = () => {
  const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  document.documentElement.dataset.theme = next;

  $("#theme").textContent = next === "dark" ? "Light" : "Dark";

$("#theme").textContent = document.documentElement.dataset.theme === "light" ? "Dark" : "Light";

/* ── battery arc ── */
function polar(cx, cy, r, d) { const a = d * Math.PI / 180; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; }
function battery(value, label) {
  const cx = 120, cy = 120, r = 96, S = 150, SW = 240;
  const p = (a, b) => { const [x1, y1] = polar(cx, cy, r, a), [x2, y2] = polar(cx, cy, r, b); return `M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${b - a > 180 ? 1 : 0} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`; };
  const len = Math.PI * r * SW / 180, track = p(S, S + SW);
  const tick = [50, 80].map((b) => { const a = S + SW * b / 100, [x1, y1] = polar(cx, cy, r + 12, a), [x2, y2] = polar(cx, cy, r + 20, a); return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--on-navy-muted)" stroke-width="1.5" opacity=".7"/>`; }).join("");
  return `<svg viewBox="0 0 240 210" role="img" aria-label="Trust battery ${value} percent" style="width:100%;display:block">
    <path d="${track}" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="10" stroke-linecap="round"/>
    <path id="arcfill" class="arc-fill" d="${track}" fill="none" stroke="var(--amber)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${len}" stroke-dashoffset="${len}" data-len="${len}" data-v="${value}"/>
    ${tick}
    <text x="120" y="126" text-anchor="middle" fill="var(--on-navy)" style="font-family:var(--font-fraunces);font-size:56px;font-weight:500">${value}<tspan style="font-size:22px" dx="2" fill="var(--on-navy-muted)">%</tspan></text>
    <text x="120" y="154" text-anchor="middle" fill="var(--on-navy-muted)" style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600">${label}</text></svg>`;
}
const arcMark = (n = 28) => `<svg width="${n}" height="${n}" viewBox="0 0 32 32"><path d="M 7.2 25 A 13 13 0 1 1 24.8 25" fill="none" stroke="var(--hair-strong)" stroke-width="3" stroke-linecap="round"/><path d="M 7.2 25 A 13 13 0 0 1 8 9.5" fill="none" stroke="var(--amber)" stroke-width="3" stroke-linecap="round"/></svg>`;
const divider = `<svg viewBox="0 0 320 24" preserveAspectRatio="none" style="width:100%;height:24px;display:block"><path d="M 0 22 Q 160 -8 320 22" fill="none" stroke="var(--hair-strong)" stroke-width="1" vector-effect="non-scaling-stroke"/><circle cx="160" cy="7" r="3" fill="var(--amber)"/></svg>`;
$("#mark").innerHTML = arcMark();

/* ── screens ── */
function home() {
  return `<div class="stack" style="padding-top:12px">
  <section class="hero">
    <div style="align-self:center">
      <p class="eyebrow amber" style="margin:0 0 14px">Tuesday evening</p>
      <h1 class="display h1" style="margin:0">What’s happening<br>with your team?</h1>
      <div style="margin-top:24px;display:grid;gap:12px">
        <label class="eyebrow" for="q">Say it plainly</label>
        <textarea id="q" rows="3" class="field" placeholder="Two of my BDAs stopped talking after the review…"></textarea>
        <button class="btn btn-primary" id="find" style="justify-self:start">Find the move</button>
      </div>
      <div style="margin-top:22px;display:flex;flex-wrap:wrap;gap:10px">
        ${SCENARIOS.map((s) => `<a class="chip" href="#/s/${s.slug}">${esc(s.title)}</a>`).join("")}
        <a class="chip" href="#/s" style="color:var(--amber-ink);border-color:transparent">All situations →</a>
      </div>
    </div>
    <aside class="card" style="background:var(--navy);border-color:transparent;padding:28px 24px 24px;color:var(--on-navy)">
      <p class="eyebrow" style="margin:0;color:var(--on-navy-muted)">Your trust battery</p>
      <div style="max-width:300px;margin:8px auto 0">${battery(50, "Where every battery starts")}</div>
      <p style="margin:4px 0 18px;text-align:center;color:var(--on-navy-muted);font-size:14.5px">It starts at 50% when you first meet someone. Ten situations will show you where yours sits now.</p>
      <div style="display:flex;justify-content:center"><a class="btn btn-primary" href="#/card">Check my battery</a></div>
    </aside>
  </section>
  ${divider}
  <section><p class="eyebrow" style="margin:0 0 12px">Next up</p>
    <div class="next">
      <a class="card press" href="#/card" style="padding:20px;display:block"><p class="eyebrow amber" style="margin:0 0 8px">Recognition</p><p class="display h2" style="margin:0 0 6px">Write a card for someone you never thanked</p><p style="margin:0;color:var(--muted)">Moment, Action, Impact, Now. Four lines, one image, ready to send.</p></a>
      <a class="card press" href="#/s/team-is-disengaged" style="padding:20px;display:block"><p class="eyebrow" style="margin:0 0 8px">Situation</p><p class="display h2" style="margin:0 0 6px">My team is disengaged</p><p style="margin:0;color:var(--muted)">A two-minute read. Start with the Trust Battery.</p></a>
    </div></section></div>`;
}
function list() {
  const groups = [...new Set(SCENARIOS.map((s) => s.group))];
  return `<div class="stack narrow" style="padding-top:12px"><header><p class="eyebrow amber" style="margin:0 0 10px">Situations</p><h1 class="display h1" style="margin:0">Pick the one that’s closest.</h1></header>
  ${groups.map((g) => `<section><h2 class="eyebrow" style="margin:0 0 10px">${esc(g)}</h2><div class="stack" style="gap:10px">${SCENARIOS.filter((s) => s.group === g).map((s) => `<a class="card press" href="#/s/${s.slug}" style="display:block;padding:18px 20px"><span class="display" style="font-size:1.25rem">${esc(s.title)}</span><span style="display:block;color:var(--muted);font-size:14px;margin-top:4px">${esc(s.concepts.join(" · "))}</span></a>`).join("")}</div></section>`).join("")}</div>`;
}
function scenario(slug) {
  const s = SCENARIOS.find((x) => x.slug === slug); if (!s) return list();
  const a = s.answer;
  const B = (n, t, body) => `<section style="display:grid;gap:10px"><h2 class="eyebrow" style="margin:0;display:flex;gap:10px"><span style="color:var(--amber-ink)">${n}</span>${t}</h2>${body}</section>`;
  return `<article class="narrow" style="padding-top:12px;display:grid;gap:36px">
  <header><a href="#/s" style="color:var(--muted);font-size:14px">← Situations</a><p class="eyebrow amber" style="margin:22px 0 10px">${esc(s.group)}</p><h1 class="display h1" style="margin:0">${esc(s.title)}</h1></header>
  ${B("01", "What’s actually going on", `<div class="read"><p>${esc(a.going_on)}</p></div>`)}
  ${B("02", "What not to do first", `<div class="read"><p>${esc(a.not_first)}</p></div>`)}
  ${B("03", "The move", `<ol class="read" style="margin:0;padding:0;list-style:none;display:grid;gap:14px">${a.move.map((m, i) => `<li style="display:grid;grid-template-columns:2.2rem 1fr;align-items:baseline"><span class="display" style="color:var(--amber-ink);font-size:1.5rem">${i + 1}</span><span>${esc(m)}</span></li>`).join("")}</ol>`)}
  ${B("04", "Words you can use", `<div style="display:grid;gap:16px;border-left:2px solid var(--amber);padding-left:18px">${a.words.map((w) => `<p class="quote" style="margin:0">${esc(w)}</p>`).join("")}${a.words_note ? `<p class="read" style="margin:0;color:var(--muted)">${esc(a.words_note)}</p>` : ""}</div>`)}
  ${B("05", "How you’ll know it worked", `<div class="read"><p>${esc(a.worked)}</p></div>`)}
  ${a.watch_for ? `<section class="card" style="padding:20px 22px;border-color:var(--amber)"><h2 class="eyebrow amber" style="margin:0 0 8px">Watch for</h2><p class="read" style="margin:0">${esc(a.watch_for)}</p></section>` : ""}
  ${divider}
  ${B("06", "Go deeper", `<div style="display:flex;flex-wrap:wrap;gap:10px">${a.deeper.map((d) => `<span class="chip" style="color:var(--muted)">${esc(d.label)}${d.workbookPage ? ` · Workbook p.${d.workbookPage}` : ""}</span>`).join("")}</div>`)}
  <div style="display:grid;gap:14px;justify-items:start"><button class="btn btn-primary" onclick="alert('The coach is built in the next step.')">Talk it through →</button><p style="margin:0;font-size:13px;color:var(--faint)">Source: ${esc(s.source)}</p></div></article>`;
}

/* ── MAIN card builder (same renderer as the app) ── */
const FIELDS = [["moment", "M", "Moment", "Which specific moment? Name the situation.", "Last Tuesday, when you noticed the error before it left your desk."], ["action", "A", "Action", "What did they do? A behaviour, not a trait.", "You stayed back and fixed it yourself instead of waiting for someone else to catch it."], ["impact", "I", "Impact", "Why did it matter? The effect on work, team, customer, or you.", "We avoided a problem that could have affected the whole team’s reputation."]];
let D = { kind: "maestro", to: "", from: "", moment: "", action: "", impact: "", now: "I’m recognising this today, while it’s still fresh.", thanks: "" }, design = "navy", tab = "write";
const FONTS = { display: "Fraunces, Georgia, serif", ui: "Inter, system-ui, sans-serif" };
function card() {
  return `<div style="padding-top:12px"><header class="narrow" style="margin-bottom:22px"><p class="eyebrow amber" style="margin:0 0 10px">Recognition</p><h1 class="display h1" style="margin:0 0 12px">Write the card.</h1><p style="margin:0;color:var(--muted);max-width:52ch">Recognition is information, not reward. Be specific enough that they know exactly what to keep doing.</p></header>
  <div class="tabs"><button class="chip" data-tab="write" style="flex:1;justify-content:center">Write</button><button class="chip" data-tab="preview" style="flex:1;justify-content:center">Preview</button></div>
  <div class="builder"><section id="pane-write" style="display:grid;gap:26px">
    <fieldset style="border:0;padding:0;margin:0"><legend class="eyebrow" style="margin-bottom:10px">Who is it for</legend><div style="display:flex;gap:10px;flex-wrap:wrap">${Object.entries(KIND_LABEL).map(([k, v]) => `<button class="chip" data-kind="${k}"><strong style="margin-right:6px">${v.name}</strong><span style="color:var(--muted)">${v.who}</span></button>`).join("")}</div></fieldset>
    <div style="display:grid;gap:14px;grid-template-columns:1fr 1fr"><div><label class="lbl" for="to">Their name</label><input id="to" class="field" placeholder="Ravi" maxlength="28"></div><div><label class="lbl" for="from">Your name</label><input id="from" class="field" placeholder="Your name" maxlength="28"></div></div>
    ${FIELDS.map(([k, l, n, h, ph]) => `<div><label class="lbl" for="${k}"><span class="display" style="color:var(--amber-ink);margin-right:8px;font-size:1.2rem">${l}</span>${n}</label><p class="hint">${h}</p><textarea id="${k}" class="field" rows="3" maxlength="${LIMIT}" placeholder="${esc(ph)}"></textarea><div style="display:flex;justify-content:space-between;gap:12px;margin-top:6px;font-size:14px"><span id="${k}-note"></span><span id="${k}-n" style="color:var(--faint)">0/${LIMIT}</span></div></div>`).join("")}
    <div><label class="lbl" for="now"><span class="display" style="color:var(--amber-ink);margin-right:8px;font-size:1.2rem">N</span>Now</label><p class="hint">Don’t wait. Recognition lands best when it’s timely.</p><textarea id="now" class="field" rows="2" maxlength="${LIMIT}"></textarea></div>
    <div><label class="lbl" for="thanks">A closing line <span style="color:var(--faint);font-weight:400">(optional)</span></label><input id="thanks" class="field" maxlength="110" placeholder="Thank you for taking ownership and protecting the team’s standards."></div>
    <fieldset style="border:0;padding:0;margin:0"><legend class="eyebrow" style="margin-bottom:10px">Card design</legend><div style="display:flex;gap:10px">${Object.entries(DESIGNS).map(([id, c]) => `<button class="chip" data-design="${id}" style="gap:8px"><span style="width:16px;height:16px;border-radius:5px;background:${c.bg};border:1px solid var(--hair-strong);display:inline-block"></span>${c.label}</button>`).join("")}</div></fieldset>
  </section>
  <section id="pane-preview" class="pane-preview" style="display:grid;gap:18px;align-content:start"><canvas id="cv" width="${W}" height="${H}" style="width:100%;max-width:440px;height:auto;aspect-ratio:${W}/${H};border-radius:14px;border:1px solid var(--hair);justify-self:center"></canvas>
    <div style="display:grid;gap:10px"><button class="btn btn-primary" id="dl">Download PNG</button><button class="btn btn-ghost" id="cp">Copy text for Teams</button><p id="status" role="status" style="margin:0;min-height:20px;font-size:14px;color:var(--muted)"></p></div></section></div></div>`;
}
function bindCard() {
  const redraw = () => {
    drawCard($("#cv").getContext("2d"), D, design, FONTS, true);
    FIELDS.forEach(([k]) => { const c = check(k, D[k]); const n = $("#" + k + "-note"); n.textContent = c ? c.msg : ""; n.style.color = c ? (c.level === "block" ? "var(--danger)" : "var(--amber-ink)") : ""; $("#" + k + "-n").textContent = D[k].length + "/" + LIMIT; });
    const ok = readyToExport(D); $("#dl").disabled = !ok; $("#cp").disabled = !ok;
    if (!$("#status").dataset.sticky) $("#status").textContent = ok ? "1080 × 1350 PNG. Sharp on a phone." : "Fill who, moment, action and impact to enable download.";
    document.querySelectorAll("[data-kind]").forEach((b) => (b.style.borderColor = b.dataset.kind === D.kind ? "var(--amber)" : ""));
    document.querySelectorAll("[data-design]").forEach((b) => (b.style.borderColor = b.dataset.design === design ? "var(--amber)" : ""));
    document.querySelectorAll("[data-tab]").forEach((b) => (b.style.borderColor = b.dataset.tab === tab ? "var(--amber)" : ""));
    $("#pane-write").classList.toggle("hide-m", tab !== "write"); $("#pane-preview").classList.toggle("hide-m", tab !== "preview");
  };
  ["to", "from", "moment", "action", "impact", "now", "thanks"].forEach((k) => { const el = $("#" + k); el.value = D[k]; el.oninput = () => { D[k] = el.value; delete $("#status").dataset.sticky; redraw(); }; });
  document.querySelectorAll("[data-kind]").forEach((b) => (b.onclick = () => { D.kind = b.dataset.kind; redraw(); }));
  document.querySelectorAll("[data-design]").forEach((b) => (b.onclick = () => { design = b.dataset.design; redraw(); }));
  document.querySelectorAll("[data-tab]").forEach((b) => (b.onclick = () => { tab = b.dataset.tab; redraw(); }));
  $("#dl").onclick = () => { const off = document.createElement("canvas"); off.width = W; off.height = H; drawCard(off.getContext("2d"), D, design, FONTS, false); off.toBlob((bl) => { const a = document.createElement("a"); a.href = URL.createObjectURL(bl); a.download = "recognition-" + (D.to || "card").toLowerCase().replace(/[^a-z0-9]+/g, "-") + ".png"; a.click(); }); };
  $("#cp").onclick = async () => { try { await navigator.clipboard.writeText(teamsText(D)); $("#status").textContent = "Copied. Paste it into Teams."; } catch { $("#status").textContent = "Couldn’t copy here."; } $("#status").dataset.sticky = 1; };
  Promise.all([document.fonts.load("500 80px Fraunces"), document.fonts.load("italic 400 38px Fraunces"), document.fonts.load("400 30px Inter"), document.fonts.load("600 20px Inter")]).catch(() => {}).finally(redraw);
  redraw();
}

/* ── router ── */
function route() {
  const h = location.hash.replace(/^#\/?/, "");
  const [a, b] = h.split("/");
  let html, nav = a || "home";
  if (!a) html = home(); else if (a === "s") { html = b ? scenario(b) : list(); nav = "s"; } else if (a === "card") { html = card(); nav = "card"; } else html = home();
  app.innerHTML = html; window.scrollTo(0, 0);
  document.querySelectorAll("nav a").forEach((l) => l.classList.toggle("on", l.dataset.n === nav || (nav === "home" && l.dataset.n === "home")));
  if (nav === "card") bindCard();
  const f = $("#arcfill"); if (f) requestAnimationFrame(() => { f.style.strokeDashoffset = f.dataset.len * (1 - f.dataset.v / 100); });
  const find = $("#find"); if (find) find.onclick = () => { location.hash = "#/s"; };
}
addEventListener("hashchange", route); route();

</script></body></html>
